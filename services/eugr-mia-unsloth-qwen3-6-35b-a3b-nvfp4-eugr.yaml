# MiaAI-Lab Unsloth Qwen3.6-35B-A3B-NVFP4 recipe ported to eugr stack.
# Source: https://github.com/MiaAI-Lab/Unsloth-Qwen3.6-35b-NVFP4-DGX-Spark (start.sh)
#
# Diff vs Mia start.sh (forced by eugr image, not recipe choice):
#   - image: eugr vllm-node (not mia-vllm-gb10-linear-b12x)
#   - --linear-backend flashinfer_b12x OMITTED — stock eugr hard-fails on mixed
#     FP8 dense layers without Mia's soft-fallback patch.
recipe_version: "1"
name: mia-unsloth-qwen3-6-35b-a3b-nvfp4-eugr
description: >-
  Mia's Unsloth Qwen3.6-35B-A3B-NVFP4 flags on eugr (MTP×2, FP8 KV, high
  concurrency; B12X linear omitted — needs Mia image soft-fallback).

model: unsloth/Qwen3.6-35B-A3B-NVFP4
container: vllm-node

env:
  VLLM_TARGET_DEVICE: cuda
  CUTE_DSL_ARCH: sm_121a

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  gpu_memory_utilization: 0.80
  max_model_len: 262144
  max_num_seqs: 24
  max_num_batched_tokens: 32768

command: |
  vllm serve /models/unsloth/qwen3.6-35b-a3b-nvfp4/nvfp4 \
    --host {host} \
    --port {port} \
    --served-model-name unsloth/Qwen3.6-35B-A3B-NVFP4 \
    --tensor-parallel-size {tensor_parallel} \
    --trust-remote-code \
    --moe-backend auto \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --attention-backend flashinfer \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --enable-chunked-prefill \
    --async-scheduling \
    --kv-cache-dtype fp8 \
    --limit-mm-per-prompt '{{"image":4}}' \
    --allowed-media-domains '*' \
    --speculative-config '{{"method":"mtp","num_speculative_tokens":2,"moe_backend":"triton"}}' \
    --reasoning-parser qwen3 \
    --default-chat-template-kwargs '{{"enable_thinking":true,"preserve_thinking":true}}' \
    --tool-call-parser qwen3_coder \
    --enable-auto-tool-choice \
    --override-generation-config '{{"temperature":0.6,"top_p":0.95,"top_k":20,"min_p":0.0,"presence_penalty":0.0,"repetition_penalty":1.0}}'
