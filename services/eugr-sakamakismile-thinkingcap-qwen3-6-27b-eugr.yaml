recipe_version: "1"
name: sakamakismile-thinkingcap-qwen3-6-27b-eugr
description: eugr vLLM serve for sakamakismile/thinkingcap-qwen3.6-27b

model: thinkingcap-qwen3.6-27b
container: vllm-node

env:
  VLLM_MARLIN_USE_ATOMIC_ADD: "1"

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  gpu_memory_utilization: 0.85
  max_model_len: 262144
  max_num_seqs: 4
  max_num_batched_tokens: 8192

command: |
  vllm serve /models/sakamakismile/thinkingcap-qwen3.6-27b/hf \
    --host {host} \
    --port {port} \
    --served-model-name thinkingcap-qwen3.6-27b \
    --tensor-parallel-size {tensor_parallel} \
    --trust-remote-code \
    --language-model-only \
    --enable-auto-tool-choice \
    --tool-call-parser qwen3_xml \
    --kv-cache-dtype auto \
    --moe-backend marlin \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --enable-chunked-prefill \
    --enable-prefix-caching \
    --load-format auto
