# Generated by spark-inference MTP scaffold (radixark-qwen3-8-27b-mtp-eugr)
recipe_version: "1"
name: radixark-qwen3-8-27b-mtp-eugr
description: eugr vLLM MTP speculative serve for radixark/qwen3.8-27b

model: qwen3.8-27b-mtp
container: vllm-node

env:
  VLLM_MARLIN_USE_ATOMIC_ADD: "1"

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  gpu_memory_utilization: 0.85
  max_model_len: 262144
