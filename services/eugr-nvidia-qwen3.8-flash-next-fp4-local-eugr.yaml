# NVIDIA Qwen3.8-Flash-Next-FP4-Local on eugr/spark-vllm-b12x.
# Spark flags from the NVIDIA card (2026-10-15). New NVFP4 scale compression
# needs --load-format b12x + --quantization modelopt_mixed; upstream vLLM
# cannot load this checkpoint yet.
recipe_version: "1"
name: nvidia-qwen3.8-flash-next-fp4-local-eugr
description: >-
  NVIDIA QAD FP4-Local (~96 GiB) for one DGX Spark. Vision on, MTP 4,
  PLE table on disk, FP8 KV. Not the Aug 31 datacenter NVFP4 (~124 GiB).

model: nvidia/Qwen3.8-Flash-Next-FP4-Local
container: eugr/spark-vllm-b12x@sha256:03a956544e9f9b4b7ba91690469fbe7848bdbef29a7d2e0f5788368467bb3595
skip_default_mods: true

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  gpu_memory_utilization: 0.8
  max_model_len: 262144
  max_num_seqs: 8
  max_num_batched_tokens: 4096
  spec_tokens: 4

env:
  VLLM_PLE_TABLE_MEMORY: disk
  B12X_DISK_BACKEND: io_uring
  CUTE_DSL_ARCH: sm_121a
  SAFETENSORS_FAST_GPU: "1"
  VLLM_WORKER_MULTIPROC_METHOD: spawn
  VLLM_SSM_CONV_STATE_LAYOUT: DS
  VLLM_USE_AOT_COMPILE: "1"
  VLLM_USE_MEGA_AOT_ARTIFACT: "1"
  VLLM_USE_V2_MODEL_RUNNER: "1"
  B12X_POLICY_MODE: auto
  VLLM_MXFP8_LM_HEAD: "1"
  VLLM_B12X_MOE_FP4_LAYER_MAX_INPUT_SCALE: w13
  VLLM_B12X_MOE_FP4_FORCE_A16: "1"
  B12X_W4A16_A4_PREFILL: "1"

command: |
  vllm serve /models/nvidia/qwen3.8-flash-next-fp4-local/hf \
    --host {host} \
    --port {port} \
    --served-model-name qwen3.8-flash-next-fp4-local \
    --tensor-parallel-size {tensor_parallel} \
    --pipeline-parallel-size 1 \
    --trust-remote-code \
    --mamba-cache-mode align \
    --enable-prefix-caching \
    --enable-chunked-prefill \
    --dtype bfloat16 \
    --kv-cache-dtype fp8 \
    --quantization modelopt_mixed \
    --block-size 16 \
    --load-format b12x \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --speculative-config '{{"method":"mtp","num_speculative_tokens":{spec_tokens}}}' \
    --gdn-decode-kernel b12x \
    --linear-backend b12x \
    --moe-backend b12x \
    --no-enable-flashinfer-autotune \
    --mm-encoder-tp-mode data \
    --reasoning-parser qwen3 \
    --tool-call-parser qwen3_xml \
    --enable-auto-tool-choice \
    --compilation-config '{{"pass_config":{{"fuse_act_quant":true}}}}' \
    --gpu-memory-utilization {gpu_memory_utilization}
