notes: 'Hyperdrive on NVIDIA QAD FP4-Local (b9ce18a6, ~96 GiB, all 10 routed experts)
  on eugr/spark-vllm-b12x (digest 03a95654). Card recipe plus MTP 3 with probabilistic
  drafting (standard rejection sampling, outputs keep the target distribution) and
  mods/hyperdrive: a 34,048-token MTP draft vocabulary, a recurrent checkpoint 8 tokens
  before each prompt end (multi-turn turns stop re-prefilling 4-8K tokens), and static
  NVFP4 expert scales (expanded once after load instead of decoded on every MoE call;
  bit-identical). PBM 49.8/25.7/16.2 on one Spark (mean of 5 warmed runs, Nov 10, 2026).
  Fastest full-quality FP4-Local entry. Quality equal to the card recipe with reasoning
  on and off (GSM8K, HumanEval, tools, needle to 100K). Not the datacenter NVFP4 pack,
  not Mia NVFP4, not azampatti INT4.'
